# DataAgent 生产环境部署
# 用法: docker compose -f docker-compose.prod.yml up -d

services:
  # ========== MySQL ==========
  mysql:
    image: mysql:8.0
    container_name: dataagent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data-agent-management/src/main/resources/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: dataagent-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========== 后端 ==========
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dataagent-backend
    ports:
      - "8065:8065"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATA_AGENT_DATASOURCE_URL: jdbc:mysql://mysql:3306/saa_data_agent?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      DATA_AGENT_DATASOURCE_USERNAME: root
      DATA_AGENT_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SERVER_PORT: 8065

  # ========== 前端 ==========
  frontend:
    build:
      context: ./data-agent-frontend
      dockerfile: Dockerfile.frontend
    container_name: dataagent-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
