name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============ Backend ============
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Unit Test
        run: ./mvnw verify -pl data-agent-management -DskipITs
        env:
          DATA_AGENT_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/saa_data_agent?useSSL=false&allowPublicKeyRetrieval=true
          DATA_AGENT_DATASOURCE_USERNAME: root
          DATA_AGENT_DATASOURCE_PASSWORD: root

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: data-agent-management/target/*.jar

  # ============ Frontend ============
  frontend:
    name: Frontend - Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: data-agent-frontend/package-lock.json

      - name: Install
        run: cd data-agent-frontend && npm ci

      - name: Build
        run: cd data-agent-frontend && npm run build:ci

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: data-agent-frontend/dist/
